[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "serpent-router"
version = "1.0.0"
description = "Serpent: a quota-aware gateway that pools many SERP API accounts behind one key."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Robin" }]
keywords = ["serp", "proxy", "quota", "serper", "serpapi", "api-gateway"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: Proxy Servers",
]
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
serpent = "serpent.cli:main"

[project.urls]
Homepage = "https://github.com/d-robin/serpent"
Issues = "https://github.com/d-robin/serpent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/serpent"]
# The Snake Charmer bundle is built from ui/ (npm run build) and git-ignored.
artifacts = ["src/serpent/ui_dist/**"]

[tool.hatch.build.targets.sdist]
include = ["src", "ui", "tests", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines are fine; no formatter is enforced
