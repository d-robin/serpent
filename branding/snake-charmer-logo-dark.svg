<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"><style>.sa{stroke:#4fd1c5}.sb{stroke:#7c9cff}.sc{stroke:#8bd96b}.fa{fill:#4fd1c5}.fb{fill:#7c9cff}.fc{fill:#8bd96b}.s1{stop-color:#4fd1c5}.s2{stop-color:#7c9cff}.ink{fill:#0b0f14}.tx{fill:#e6edf3}.dim{fill:#8b9cad}</style>
