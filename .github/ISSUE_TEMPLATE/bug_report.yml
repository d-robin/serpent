name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    attributes: { label: What happened, description: "What did you expect instead?" }
    validations: { required: true }
  - type: textarea
    attributes: { label: Steps to reproduce }
  - type: input
    attributes: { label: Version, description: "`serpent version`" }
  - type: input
    attributes: { label: Platform, description: "OS, Python, Docker / Pi / systemd" }
  - type: textarea
    attributes:
      label: Logs
      description: "`serpent fault` output. **Remove any API keys first.**"
      render: text
